# Toldwell Brand System
# Source of truth — generates DESIGN.md, tokens.css, tailwind.css, tokens.json, docs/
# Last updated: 2026-05-07
# Reconciled against live toldwell.com + Toldwell Capabilities Deck.pdf

meta:
  name: Toldwell
  tagline: "Good stories, told well."
  sub_tagline: "We are a video studio partnering with agencies, brands, and leaders to create films and narratives that stick."
  description: "A video studio crafting work that holds meaning, creates impact, and stands the test of time."
  url: https://toldwell.com
  brand_site: https://brand.toldwell.com
  capabilities_deck: https://pitch.com/v/toldwell-capabilities-deck---public-4p7pzq
  inquiry_form: https://tally.so/r/mVz6dv
  contact_email: hello@toldwell.com
  location: "Chattanooga, TN"
  founded: 2020   # update if known different
  favicon: https://framerusercontent.com/images/pdG7wnHWSIz40DFnecZAchvHusY.svg
  founders:
    - name: "Jon Bouvier"
      role: "Director, Co-Owner"
    - name: "William Vest"
      role: "Producer, Co-Owner"

# ─── 1. Visual Theme & Atmosphere ──────────────────────────────────────────────

atmosphere:
  mood: "Reverent, deliberate, story-driven"
  density: comfortable           # compact | moderate | comfortable
  shape_language: "Pill-rounded for actions (100px), softly rounded surfaces (40px), generous whitespace. Sharp edges only when intentional."
  depth: "Subtle inset shadows on cards. Pressed/etched feel rather than elevated. Floating drop shadows feel synthetic — Toldwell prefers the weight of substance."
  philosophy: "Toldwell makes work that lasts. The design should feel the same — calm where others are loud, considered where others are fast, durable where others are disposable."
  one_liner: "Nearly achromatic. Gold held in reserve. Story before style."

# ─── 2. Color Palette ──────────────────────────────────────────────────────────
# Reality check: the live toldwell.com palette is intentionally minimal.
# Almost monochromatic — black/white/light-gray base with a single warm gold
# accent held in reserve. This is the Anthropic pattern, applied to film.

colors:
  brand:
    toldwell-gold:
      hex: "#F3CC92"
      role: "Primary accent. Reserved for moments that deserve warmth — hero punctuation, key CTAs, accent surfaces. Used sparingly; that's what gives it meaning."

  accent:
    toldwell-gold-soft:
      hex: "#F8E0BB"
      role: "Tinted gold backgrounds, subtle accent fills, hover states on light surfaces"
    toldwell-gold-deep:
      hex: "#D9A85F"
      role: "Hover/pressed state for gold CTAs"

  neutrals:
    # The live site uses a deliberately small neutral set. We keep it tight.
    toldwell-dark:
      hex: "#1B1B1C"
      role: "Primary text, dark surfaces, footer, navigation. Toldwell's near-black — neutral charcoal with the faintest warm undertone. Pure black is reserved for overlays and special cases."
    pure-black:
      hex: "#000000"
      role: "Hard black for overlay scrims, max-contrast situations, video letterboxing"
    pure-black-75:
      hex: "#000000BF"
      role: "75% black overlay for video poster gradients and scrim effects"
    mid-gray:
      hex: "#6B6B6B"
      role: "Secondary text, muted captions, dividers on dark surfaces"
    surface-light:
      hex: "#F2F2F2"
      role: "Section surfaces, content containers on light pages"
    bone:
      hex: "#FFFFFF"
      role: "Page canvas, light text on dark backgrounds, card surfaces"

  semantic:
    # Toldwell doesn't use status colors prominently — these are utility tokens
    # for forms / system states only. Keep them muted, not loud.
    success:
      hex: "#3D8A5F"
      role: "Form success state, positive confirmation"
    warning:
      hex: "#D9A85F"
      role: "Warning state — intentionally aligns with toldwell-gold-deep"
    error:
      hex: "#B5453A"
      role: "Form error state, destructive action"
    info:
      hex: "#4A6B8A"
      role: "Informational notice, neutral system status"

  selection:
    text: "#FFFFFF"
    background: "#1B1B1C"

# ─── 2a. Surfaces (semantic surface naming) ────────────────────────────────────

surfaces:
  canvas:
    value: "#FFFFFF"
    role: "Default page background"
  card:
    value: "#F2F2F2"
    role: "Card / section surface, slightly recessed against canvas"
  dark-stage:
    value: "#1B1B1C"
    role: "Dark hero sections, footers, full-bleed cinematic blocks. The most common alternative canvas to white."
  black-stage:
    value: "#000000"
    role: "Pure black — reserved for video letterboxing, overlay scrims, max-contrast moments"
  accent-stage:
    value: "#F3CC92"
    role: "Gold full-bleed sections. Used rarely, for moments that should feel warm and chosen."

# ─── 3. Typography ─────────────────────────────────────────────────────────────

typography:
  fonts:
    display:
      family: "Belwe"
      variants: ["Regular (400)", "Medium (500)", "Bold (700)", "Italic"]
      source: "Custom (uploaded to Framer; needs self-hosted woff2 for site portability)"
      role: "Hero headlines, display text, named brand moments. Belwe gives Toldwell its distinctive warm serif character — the editorial weight of a film title card."
    body:
      family: "Red Hat Display"
      weights: [400, 500, 600, 700, 900]
      source: "Google Fonts"
      role: "Headings, subheadings, body text, UI elements. The clean sans-serif partner — modern, readable, gets out of the way."

  ratio:
    body: "Major Third (1.25) from 12px base"
    display: "Editorial — Belwe sizes are chosen for cinematic impact, not a ratio"

  scale:
    # Display sizes (Belwe) — editorial, not algorithmic
    - { name: "display-xxl",  size: 215, line_height: 1.0,  weight: 400, font: "Belwe", use: "Hero splash text" }
    - { name: "display-xl",   size: 120, line_height: 1.0,  weight: 400, font: "Belwe", use: "Large hero headlines" }
    - { name: "display-lg",   size: 100, line_height: 1.05, weight: 400, font: "Belwe", use: "Section hero text" }
    - { name: "display-md",   size: 92,  line_height: 1.05, weight: 400, font: "Belwe", use: "Feature headlines" }
    - { name: "display-sm",   size: 70,  line_height: 1.1,  weight: 400, font: "Belwe", use: "Secondary headlines" }
    # Heading sizes (Red Hat Display)
    - { name: "h1",       size: 48, line_height: 1.15, weight: 700, font: "Red Hat Display", use: "Page titles" }
    - { name: "h2",       size: 32, line_height: 1.25, weight: 600, font: "Red Hat Display", use: "Section titles" }
    - { name: "h3",       size: 30, line_height: 1.3,  weight: 600, font: "Red Hat Display", use: "Subsection titles" }
    - { name: "h4",       size: 26, line_height: 1.35, weight: 500, font: "Red Hat Display", use: "Card titles, feature headers" }
    - { name: "h5",       size: 24, line_height: 1.4,  weight: 500, font: "Red Hat Display", use: "Small section headers" }
    # Body sizes (Red Hat Display)
    - { name: "body-lg",  size: 22, line_height: 1.5,  weight: 400, font: "Red Hat Display", use: "Lead paragraphs" }
    - { name: "body-md",  size: 20, line_height: 1.55, weight: 400, font: "Red Hat Display", use: "Standard body text" }
    - { name: "body-sm",  size: 18, line_height: 1.6,  weight: 400, font: "Red Hat Display", use: "Compact body text" }
    # Small sizes (Red Hat Display)
    - { name: "caption",  size: 12, line_height: 1.4,  weight: 500, font: "Red Hat Display", use: "Captions, labels, tags, buttons" }
    - { name: "micro",    size: 11, line_height: 1.4,  weight: 400, font: "Red Hat Display", use: "Fine print, metadata" }

  weights:
    regular: 400
    medium: 500
    semibold: 600
    bold: 700
    black: 900

  letter_spacing:
    display-xxl: "-1.5px"
    display: "-1px"
    heading: "-0.8px"
    body: "-0.4px"
    default: "-0.5px"
    label: "0.4px"

# ─── 4. Components ─────────────────────────────────────────────────────────────

components:
  buttons:
    primary:
      background: "#1B1B1C"
      text_color: "#FFFFFF"
      radius: "100px"
      padding: "12px 24px"
      font_family: "Red Hat Display"
      font_size: "12px"
      font_weight: 500
      letter_spacing: "0.4px"
      text_transform: "uppercase"
      hover:
        background: "#3A3230"

    accent:
      background: "#F3CC92"
      text_color: "#1B1B1C"
      radius: "100px"
      padding: "12px 24px"
      font_size: "12px"
      font_weight: 500
      hover:
        background: "#D9A85F"

    ghost:
      background: "transparent"
      text_color: "#1B1B1C"
      border: "1px solid #1B1B1C"
      radius: "100px"
      padding: "12px 24px"

  cards:
    default:
      background: "#F2F2F2"
      radius: "40px"
      shadow: "inset-card"
      padding: "32px"
    feature:
      background: "#FFFFFF"
      radius: "40px"
      padding: "32px"

  tags:
    radius: "100px"
    padding: "5px 15px"
    font_size: "12px"
    background: "#F2F2F2"
    text_color: "#1B1B1C"

# ─── 5. Layout ──────────────────────────────────────────────────────────────────

layout:
  base_unit: 4
  max_width: 1200
  density: comfortable

  spacing:
    "4":   4
    "8":   8
    "12":  12
    "16":  16
    "20":  20
    "24":  24
    "32":  32
    "40":  40
    "48":  48
    "64":  64
    "80":  80
    "96":  96
    "128": 128

  semantic_spacing:
    section_gap: 80
    card_padding: 32
    element_gap: 8

  radii:
    none: 0
    md: 40
    pill: 100
    full: 9999

  named_radii:
    buttons: 100
    tags: 100
    pill: 100
    cards: 40
    feature: 40
    inputs: 40

# ─── 6. Depth & Elevation ──────────────────────────────────────────────────────

depth:
  shadows:
    none: "none"
    inset-card: "rgba(0, 0, 0, 0.18) 0.3px 0.6px 0.67px -1.25px inset, rgba(0, 0, 0, 0.16) 1.14px 2.29px 2.56px -2.5px inset, rgba(0, 0, 0, 0.063) 5px 10px 11.18px -3.75px inset"
    inset-card-deep: "rgba(0, 0, 0, 0.22) 0.5px 1px 1.5px -1.5px inset, rgba(0, 0, 0, 0.18) 2px 4px 5px -2.5px inset, rgba(0, 0, 0, 0.08) 7px 14px 16px -4px inset"
    focus-ring: "0 0 0 3px rgba(243, 204, 146, 0.4)"
  notes: "Toldwell uses inset shadows for surfaces — pressed, not floating. Drop shadows reserved for focus rings only. The aesthetic is substance, not lift."

# ─── 7. Do's and Don'ts ────────────────────────────────────────────────────────

guidelines:
  do:
    - "Use Belwe for hero / display text — it carries the brand voice"
    - "Use Red Hat Display for everything else"
    - "Use Toldwell Dark (#1B1B1C) instead of pure black — pure black is reserved for video overlays"
    - "Hold the gold (#F3CC92) in reserve — for CTAs, key punctuation, deliberate warmth"
    - "Maintain generous whitespace — let the work breathe"
    - "Pill-shaped buttons (100px) and softly-rounded cards (40px)"
    - "Use inset shadows on cards, not drop shadows"
  dont:
    - "Don't use pure black (#000000) for text or surfaces — that's for video letterboxing only"
    - "Don't use drop shadows — Toldwell surfaces are pressed, not floating"
    - "Don't introduce colors outside the palette"
    - "Don't use Belwe for body text — display only"
    - "Don't field gold across full sections without a reason — it loses meaning when overused"
    - "Don't use sharp corners except when intentional"
    - "Don't make interactive elements rectangular — always pill-shaped"

# ─── 8. Responsive ─────────────────────────────────────────────────────────────

responsive:
  breakpoints:
    mobile: 390
    tablet: 768
    desktop: 1200
    wide: 1440
  notes: "Display text scales dramatically between breakpoints. Mobile gets simplified hero treatment, desktop gets full editorial weight."

# ─── 9. Agent Prompt Guide ─────────────────────────────────────────────────────

agent:
  quick_reference:
    primary: "#1B1B1C"
    accent: "#F3CC92"
    canvas: "#FFFFFF"
    surface-card: "#F2F2F2"
    display_font: "Belwe"
    body_font: "Red Hat Display"
    button_radius: "100px"
    card_radius: "40px"
    base_spacing: "4px"
    type_ratio: "Major Third (1.25) from 12px"

  prompts:
    - "Build a Toldwell hero section: dark canvas (#1B1B1C), Belwe display headline 'Good stories, told well.', Red Hat Display sub-tagline, single warm-gold (#F3CC92) CTA pill button. Generous whitespace. No drop shadows."
    - "Create a portfolio grid of video case studies: light canvas, F2F2F2 card surfaces with 40px radius and inset shadows, Belwe project titles, Red Hat Display body. Pill-shaped tags for category."
    - "Design a dark footer (#1B1B1C) with Red Hat Display, sub-100% opacity socials list (Instagram + LinkedIn + YouTube), gold pill CTA 'Let's make something meaningful', email hello@toldwell.com."
    - "Editorial film case study layout: white canvas, Belwe display title, em-dash heavy body copy, hold gold for the closing 'Watch the film' CTA only."

# ─── 10. Voice & Tone (OmD v0.1) ───────────────────────────────────────────────

voice:
  personality: ["Reverent", "Considered", "Story-driven", "Earnest", "Crafted"]
  tone_spectrum:
    formal: 5         # Professional but not stiff
    playful: 3        # Gentle, not punchy
    technical: 4      # Process-fluent without jargon
    emotional: 8      # Genuine warmth, not performative
  microcopy:
    cta_style: "Direct, declarative, low-noise. 'Let's get to work.' / 'Watch our showreel.' / 'View our deck.' / 'Work with us.' Short, action-oriented, never salesy."
    headline_style: "Two-beat declarative phrases. 'Good stories, told well.' 'Stories that inspire. Stories that matter.' 'Video that lasts.' Em-dashes for emphasis."
    error_style: "Friendly, direct — never blame the user. Plain language."
  signature_phrases:
    - "Good stories, told well."
    - "Stories that inspire. Stories that matter."
    - "Video that lasts."
    - "Together, we can make something meaningful."
    - "Good stories deserve to be told."
    - "Let's get to work."
  avoid:
    - "Corporate buzzwords ('synergy', 'leverage', 'best-in-class')"
    - "Hype language ('mind-blowing', 'next-level', 'game-changing')"
    - "Filmmaking jargon in client-facing copy"
    - "Passive voice"
    - "Anything that prizes speed over substance"

# ─── 11. Brand Narrative (OmD v0.1) ────────────────────────────────────────────

narrative:
  what_we_are: "A video studio partnering with agencies, brands, and leaders to create films and narratives that stick."
  what_we_do: "We are storytellers and filmmakers crafting videos that go beyond the noise — work that holds meaning, creates impact, and stands the test of time."
  what_we_reject: "Fleeting content. Fast churn. Style without substance. Work designed only for the demands of social media and fast marketing."
  belief: "Every brand and leader has a story worth telling well. We long to create meaningful work that outlasts all those involved in its creation."
  audience: "Agencies, brands, and leaders pursuing a greater mission."
  promise: "Stories that inspire. Stories that matter."

