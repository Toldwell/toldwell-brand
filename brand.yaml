# ─── 11b. Process (from capabilities deck, pp. 10-14) ─────────────────────────

process:
  phases:
    - phase: 1
      name: "Development"
      duration: "~4 weeks"
      summary: "Identify the right video to create before deciding how to make it. Audience, budget, and organizational needs shape direction. Output: Creative Brief that guides the entire project."
      activities: ["Desk Research", "Reference Evaluation", "Tone & Look Qualifiers", "Scripting", "Project Brief / SOW Creation", "Pre-Visualization (potentially)"]
      outcomes: ["Creative Brief", "Scope of Work"]
    - phase: 2
      name: "Pre-Production"
      duration: "~4-8 weeks"
      summary: "Lock down location scouting, talent, crew, and set design. Coordinated preparation that prevents production-day issues."
      activities: ["Casting / Talent coordination", "Location Scouting", "Set Design", "Wardrobe Prep", "Crewing", "Shotlisting"]
      outcomes: ["Scripts", "Pre-visualizations"]
    - phase: 3
      name: "Production"
      duration: "~1 week"
      summary: "Filming days with a crew of 5-25 — small by commercial standards, kept that way for talent density and on-set agility."
      activities: ["Filming", "Crew Management", "Talent Direction", "Rental Facilitation"]
    - phase: 4
      name: "Post-Production"
      duration: "~4 weeks"
      summary: "Edit to script and pre-vis, share V1 on Frame.io for review, refine through written feedback rounds until the final captures the vision."
      activities: ["Editing", "Animation", "Color Grading", "Audio Mastering", "3D Rendering"]
    - phase: 5
      name: "Distribution"
      duration: "~2 weeks"
      summary: "Produce variations: alternate logos, sizes/formats, platform-specific cuts, specialty encodes. Same V1 → notes → refine pattern as post."
      activities: ["Formatting & Resizing", "File Handoff", "Specialty Encoding"]

