# ─── 12. Principles (OmD v0.1) ─────────────────────────────────────────────────

principles:
  - name: "Story First"
    description: "Every design and creative decision serves the narrative. If it doesn't help tell the story, remove it."
  - name: "Make It Last"
    description: "We craft work meant to outlive the moment that prompted it. Durability over disposability, always."
  - name: "Hold the Gold"
    description: "The accent is reserved. A single warm note across an otherwise neutral score is what makes it sing. Same goes for any element of style — restraint creates meaning."
  - name: "Talent Density"
    description: "Small, expert crews of 5-25 over large impersonal ones. Closer collaboration, faster decisions, no wasted craft."
  - name: "Substance Before Style"
    description: "Beautiful work that isn't true to the brief is a failure. Truth first, then polish."
  - name: "Breathe"
    description: "Generous whitespace. Let work and visuals command attention without clutter."

# ─── Logo ───────────────────────────────────────────────────────────────────────

logo:
  primary_svg: "assets/toldwell-wordmark.svg"   # actual asset committed to repo
  favicon: "https://framerusercontent.com/images/pdG7wnHWSIz40DFnecZAchvHusY.svg"
  clear_space: "1x height of logomark minimum"
  min_size: "32px"
  donts:
    - "Don't stretch or distort"
    - "Don't place on busy backgrounds without sufficient contrast"
    - "Don't change the logo colors outside the approved palette"
    - "Don't add effects (glow, drop shadow, outline) to the wordmark"
