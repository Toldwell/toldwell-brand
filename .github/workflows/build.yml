name: Build & Deploy Brand Site

on:
  push:
    branches: [main]
    paths:
      - 'brand.yaml'
      - 'build.js'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run build

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DESIGN.md docs/
          git diff --cached --quiet || git commit -m "chore: regenerate DESIGN.md and docs from brand.yaml"
          git push
