# Toldwell Brand Site — Content Map
#
# Drives the find-and-replace swap pass over the Cipherly templates.
# Layout, components, structure all stay Cipherly's. Only text + images swap.
#
# RULE (see RULES.md): every `from` value matches the EXACT source string
# in site/template/. We are SUBSTITUTING content in place — not creating new
# components, layouts, or behaviors.

# ─── Global swaps (applied to every page) ─────────────────────────────────────

global:
  # Brand name
  - from: "Cipherly"
    to: "Toldwell"
  - from: "cipherly.framer.website"
    to: "brand.toldwell.com"
  - from: "cipherly.dev"
    to: "toldwell.com"
  - from: "cipherly"
    to: "toldwell"

  # Contact email
  - from: "brand@toldwell.com"
    to: "hello@toldwell.com"

  # External "Go to Website" button → main Toldwell site
  - from: "https://www.google.com/"
    to: "https://toldwell.com/"

  # Social links — bare slugs → toldwellstudios handles
  - from: 'href="https://www.linkedin.com/"'
    to: 'href="https://www.linkedin.com/company/toldwellstudios/"'
  - from: 'href="https://www.instagram.com/"'
    to: 'href="https://www.instagram.com/toldwellstudios/"'

  # Copyright + version meta
  - from: "© 2024 Toldwell"
    to: "© 2025 Toldwell"
  - from: "UPDATED: May 6, 2024"
    to: "UPDATED: May 7, 2026"

# ─── Per-page swaps ───────────────────────────────────────────────────────────

pages:

  index:
    text: []

  introduction:
    text: []

  strategy:
    text: []

  color:
    text: []

  typography:
    text: []

  logo:
    text: []

  icons:
    text: []

  images:
    text: []

  resources:
    text: []

# ─── Image swaps (Cipherly CDN URLs → Toldwell local assets) ──────────────────

images:
  swaps: []
