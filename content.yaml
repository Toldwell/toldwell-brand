# Toldwell Brand Site — Content Map
#
# Drives the find-and-replace swap pass over the Cipherly templates.
# Layout, components, structure all stay Cipherly's. Only text + images swap.
#
# RULE (see RULES.md): every `from` value must match the EXACT source string
# in site/template/. We are SUBSTITUTING content in place — not creating new
# components, layouts, or behaviors.
#
# Currently empty (clean baseline). Add swaps below as needed, one at a time,
# verifying each renders correctly before adding the next.

# ─── Global swaps (applied to every page) ─────────────────────────────────────

global:
  # Brand name substitution — Cipherly's templates literally use "Cipherly"
  # in titles, meta tags, body copy, asset labels. This is the foundational
  # substitution everything else builds on.
  - from: "Cipherly"
    to: "Toldwell"
  - from: "cipherly.framer.website"
    to: "brand.toldwell.com"
  - from: "cipherly.dev"
    to: "toldwell.com"
  - from: "cipherly"
    to: "toldwell"

# ─── Per-page swaps ───────────────────────────────────────────────────────────

pages:
  index:
    text: []
  introduction:
    text: []
  strategy:
    text: []
  color:
    text: []
  typography:
    text: []
  logo:
    text: []
  icons:
    text: []
  images:
    text: []
  resources:
    text: []

# ─── Image swaps (Cipherly CDN URLs → Toldwell local assets) ──────────────────

images:
  swaps: []
